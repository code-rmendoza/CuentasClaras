name: cuentas_claras
description: "CuentasClaras - Gestión de fiados para comerciantes LATAM"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (Drift/SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^14.8.1

  # Firebase Analytics & Crashlytics
  firebase_core: ^3.12.0
  firebase_analytics: ^11.4.3

  # UI & Theme
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2

  # Export & Share
  share_plus: ^10.1.4
  pdf: ^3.11.2
  csv: ^6.0.0

  # Security
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
